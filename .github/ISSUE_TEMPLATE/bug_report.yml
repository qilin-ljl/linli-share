name: 问题反馈
description: 描述可复现的问题，方便定位与修复。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿填写 API Key、登录密码或他人的私聊内容。"
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: 系统、浏览器、项目版本或提交号。
      placeholder: "Windows 11 / Chrome / 提交号"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开……\n2. 点击……\n3. 观察……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可附已去除敏感信息的错误日志或截图说明。
